<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Бронирование номера</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            background-color: #5B2C2C;
            color: white;
        }
        .container {
            max-width: 600px;
            margin-top: 50px;
        }
        .card {
            border-radius: 10px;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
            padding: 20px;
            background: #E5E5E5;
            color: black;
        }
        .card h1 {
            color: #5B2C2C;
        }
        .btn-primary {
            background-color: #5B2C2C;
            border: none;
        }
        .btn-primary:hover {
            background-color: #4A1F1F;
        }
        .form-label {
            color: #5B2C2C;
        }
        .form-control {
            background-color: #f8f9fa;
            border: 1px solid #ccc;
        }
        .form-control:focus {
            border-color: #5B2C2C;
            box-shadow: 0 0 0 0.2rem rgba(91, 44, 44, 0.25);
        }
    </style>
</head>
<body>
<div class="container mt-5">
    <h1 class="text-center mb-4">Бронирование номера <span th:text="${room.type}"></span></h1>

    <div class="card p-4">
        <div class="card-body">
            <form th:action="@{/book-room/{id}(id=${room.id})}" th:object="${booking}" method="post">
                <div class="mb-3">
                    <label class="form-label">Дата заезда</label>
                    <input type="date" class="form-control" th:field="*{checkInDate}" required>
                </div>
                <div class="mb-3">
                    <label class="form-label">Дата выезда</label>
                    <input type="date" class="form-control" th:field="*{checkOutDate}" required>
                </div>
                <div class="mb-3">
                    <label class="form-label">Количество человек</label>
                    <input type="number" class="form-control" th:field="*{numberOfGuests}" min="1" required>
                </div>
                <button type="submit" class="btn btn-primary w-100">Забронировать</button>
            </form>
        </div>
    </div>
</div>
</body>
</html>

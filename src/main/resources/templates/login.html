<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Войти</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
           background-color: #5B2C2C;
           color: white;
       }
       .login-container {
           max-width: 400px;
           margin: auto;
           padding: 20px;
           background: #E5E5E5;
           border-radius: 10px;
           box-shadow: 0 0 10px rgba(0, 0, 0, 0.2);
           margin-top: 50px;
           color: black;
       }
       .login-container h2 {
           color: #5B2C2C;
       }
       .btn-primary {
           background-color: #5B2C2C;
           border: none;
       }
       .btn-primary:hover {
           background-color: #4A1F1F;
       }
    </style>
</head>
<body>

<div class="container">
    <div class="login-container">
        <h2 class="text-center">Вход</h2>

        <div th:if="${param.error}" class="alert alert-danger">Неверное имя пользователя или пароль.</div>
        <div th:if="${param.logout}" class="alert alert-success">Вы вышли из системы.</div>

        <form th:action="@{/login}" method="post">
            <input type="hidden" name="redirect" th:value="${param.redirect}">

            <div class="mb-3">
                <label class="form-label">Имя пользователя:</label>
                <input type="text" name="username" class="form-control" required>
            </div>

            <div class="mb-3">
                <label class="form-label">Пароль:</label>
                <input type="password" name="password" class="form-control" id="password" required>
            </div>

            <div class="mb-3 form-check">
                <input type="checkbox" class="form-check-input" id="showPassword" onclick="togglePassword()">
                <label class="form-check-label" for="showPassword">Показать пароль</label>
            </div>

            <button type="submit" class="btn btn-primary w-100">Войти</button>
        </form>

        <p class="text-center mt-3">Еще нет аккаунта? <a href="/register">Зарегистрироваться</a></p>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

<script>
    function togglePassword() {
        const passwordField = document.getElementById("password");
        passwordField.type = passwordField.type === "password" ? "text" : "password";
    }
</script>

</body>
</html>

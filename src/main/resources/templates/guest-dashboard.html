<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Личный кабинет</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
           background-color: #5B2C2C;
           color: white;
       }
       .container {
           max-width: 800px;
           margin-top: 50px;
       }
       .card {
           border-radius: 10px;
           box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
           padding: 20px;
           background: #E5E5E5;
           color: black;
       }
       .card h2 {
           color: white;
       }
       .table {
           margin-top: 20px;
       }
       .btn-primary {
           background-color: #5B2C2C;
           border: none;
       }
       .btn-primary:hover {
           background-color: #4A1F1F;
       }
       .table-striped tbody tr:nth-child(odd) {
           background-color: #f2f2f2;
       }
    </style>
</head>
<body>

<div class="container">
    <div class="card">
        <h2 class="text-center mb-4">История бронирований</h2>

        <table class="table table-striped">
            <thead class="table-dark">
            <tr>
                <th>Название отеля</th>
                <th>Тип номера</th>
                <th>Дата заезда</th>
                <th>Дата выезда</th>
                <th>Количество человек</th>
            </tr>
            </thead>
            <tbody>
            <tr th:each="booking : ${bookings}">
                <td th:text="${booking.property.name}"></td>
                <td th:text="${booking.room != null ? booking.room.type : ''}"></td>
                <td th:text="${booking.checkInDate}"></td>
                <td th:text="${booking.checkOutDate}"></td>
                <td th:text="${booking.numberOfGuests}"></td>
            </tr>
            </tbody>
        </table>

        <div class="text-center mt-4">
            <a href="/" class="btn btn-primary">Вернуться на главную</a>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>

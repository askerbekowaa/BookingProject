<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <title>HotelBookingApp</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
    body {
    background-color: #5B2C2C;
    color: white;
}

.navbar {
    background-color: #3E1E1E;
}

.navbar a {
    color: white !important;
}

.nav-link {
    color: white !important;
    padding: 10px 15px;
}

h2 {
    color: white;
}

.property-card {
    background-color: #D9D9D9;
    border-radius: 10px;
    padding: 15px;
    text-align: center;
    overflow: hidden;
    display: flex;
    flex-direction: column;
}

.property-card img {
    border-radius: 10px;
    height: 250px;
    width: 100%;
    object-fit: cover;
    flex-shrink: 0;
}

.property-info {
    padding: 10px;
    flex-grow: 1;
    color: black;
}

.property-card p {
    text-align: left;
    color: black;
    padding-left: 10px;
}

.property-card h5 {
    margin-top: 10px;
    text-align: left;
    padding-left: 10px;
    color: black;
}


.btn-primary {
    background-color: #7A3F3F;
    border: none;
    color: white;
}

.btn-primary:hover {
    background-color: #945252;
}

    </style>
</head>
<body>
<nav class="navbar navbar-expand-lg">
    <div class="container-fluid">
        <a class="navbar-brand" href="/">HotelBookingApp</a>
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
            <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="navbarNav">
            <ul class="navbar-nav ms-auto">
                <li class="nav-item" sec:authorize="isAuthenticated()">
                    <span class="nav-link">Добро пожаловать, <span th:text="${#authentication.name}"></span>!</span>
                </li>
                <li class="nav-item" sec:authorize="isAuthenticated()">
                    <a class="nav-link" href="/logout">Выйти</a>
                </li>
                <li class="nav-item" sec:authorize="!isAuthenticated()">
                    <a class="nav-link" href="/login">Войти</a>
                </li>
                <li class="nav-item" sec:authorize="hasAuthority('ROLE_GUEST')">
                    <a class="nav-link" href="/guest-dashboard">Личный кабинет</a>
                </li>
                <li class="nav-item" sec:authorize="hasAuthority('ROLE_HOST')">
                    <a class="nav-link" href="/host-dashboard">Личный кабинет</a>
                </li>
            </ul>
        </div>
    </div>
</nav>
<div class="container mt-5">
    <h1 class="text-center mb-4">Рекомендуемые отели</h1>
    <form action="/search" method="get" class="search-form mb-5">
        <div class="input-group">
            <input type="text" name="location" class="form-control" placeholder="Введите местоположение">
            <button type="submit" class="btn btn-primary">Поиск</button>
        </div>
    </form>
    <div th:if="${properties}" class="row g-4">
        <div th:each="property : ${properties}" class="col-md-4">
            <div class="property-card">
                <img th:src="${property.coverImagePath}" alt="Изображение отеля" th:unless="${property.coverImagePath == null}">
                <h5 th:text="${property.name}"></h5>
                <p>
                    <strong>Местоположение:</strong> <span th:text="${property.location}"></span><br>
                    <strong>Цена:</strong> <span th:text="'$' + ${property.pricePerNight} + '/за ночь'"></span>
                </p>
                <a th:href="@{/property/{id}(id=${property.id})}" class="btn btn-primary">Подробнее</a>
            </div>
        </div>
    </div>
    <div th:unless="${properties}" class="text-center">
        <p>Нет доступных вариантов.</p>
    </div>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>

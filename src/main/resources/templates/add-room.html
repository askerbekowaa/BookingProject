<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Добавить номер</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            background-color: #5B2C2C;
            color: white;
            font-family: Arial, sans-serif;
        }

        .container {
            max-width: 600px;
            margin: 50px auto;
        }

        .card {
            border-radius: 12px;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.2);
            padding: 25px;
            background: #E5E5E5;
            color: black;
        }

        .card h2 {
            color: #5B2C2C;
            font-weight: bold;
        }

        .form-label {
            color: #5B2C2C;
            font-weight: 600;
        }

        .form-control {
            background-color: #f8f9fa;
            border: 1px solid #bbb;
            border-radius: 8px;
            padding: 10px;
            font-size: 16px;
        }

        .form-control:focus {
            border-color: #5B2C2C;
            box-shadow: 0 0 5px rgba(91, 44, 44, 0.5);
        }

        select.form-control {
            cursor: pointer;
        }

        .btn {
            font-size: 16px;
            padding: 10px;
            border-radius: 8px;
            transition: all 0.3s ease-in-out;
        }

        .btn-primary {
            background-color: #5B2C2C;
            border: none;
        }

        .btn-primary:hover {
            background-color: #4A1F1F;
        }

        .btn-secondary {
            background-color: #E5E5E5;
            color: #5B2C2C;
            border: 1px solid #5B2C2C;
        }

        .btn-secondary:hover {
            background-color: #5B2C2C;
            color: white;
        }

        .text-center {
            margin-top: 15px;
        }

    </style>
</head>

<div class="container">
    <div class="card">
        <h2 class="text-center mb-4">Добавить номер</h2>

        <form th:action="@{/add-room/{propertyId}(propertyId=${propertyId})}" th:object="${room}" method="post" enctype="multipart/form-data">
            <div class="mb-3">
                <label class="form-label">Тип номера:</label>
                <select th:field="*{type}" class="form-control">
                    <option value="Люкс">Люкс</option>
                    <option value="Стандарт">Стандарт</option>
                    <option value="Семейный">Семейный</option>
                </select>
            </div>
            <div class="mb-3">
                <label class="form-label">Удобства:</label>
                <input type="text" th:field="*{amenities}" class="form-control">
            </div>
            <div class="mb-3">
                <label class="form-label">Цена за ночь:</label>
                <input type="number" th:field="*{pricePerNight}" class="form-control" step="0.01">
            </div>
            <div class="mb-3">
                <label class="form-label">Изображение:</label>
                <input type="file" name="image" accept="image/*" class="form-control">
            </div>
            <button type="submit" class="btn btn-primary w-100">Добавить номер</button>
        </form>

        <div class="text-center mt-3">
            <a href="/host-dashboard" class="btn btn-secondary">Назад</a>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>

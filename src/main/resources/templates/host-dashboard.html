<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Личный кабинет хоста</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
       background-color: #5B2C2C;
       color: white;
   }
   .container {
       max-width: 800px;
       margin-top: 50px;
   }
   .card {
       border-radius: 10px;
       box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
       padding: 20px;
       background: #E5E5E5;
       color: black;
   }
   .card h2 {
       color: #5B2C2C;
   }
   .btn-add-room {
       background-color: #A68D5D;
       color: white;
       border: none;
   }
   .btn-add-room:hover {
       background-color: #8C7A4F;
   }
   .btn-delete-hotel {
       background-color: #8C3A3A;
       color: white;
       border: none;
   }
   .btn-delete-hotel:hover {
       background-color: #732F2F;
   }
   .btn-show-rooms {
       background-color: #567A7A;
       color: white;
       border: none;
   }
   .btn-show-rooms:hover {
       background-color: #466666;
   }
   .rooms-table {
       display: none;
       margin-top: 15px;
   }
   .error-message {
       color: red;
       font-weight: bold;
       text-align: center;
       margin-bottom: 10px;
   }
   .btn-secondary {
       background-color: #E5E5E5;
       color: #5B2C2C;
       border: 1px solid #5B2C2C;
   }
   .btn-secondary:hover {
       background-color: #5B2C2C;
       color: white;
   }
   .button-container {
       display: flex;
       justify-content: space-between;
   }
   .btn-primary {
       background-color: #5B2C2C;
       border: none;
   }
   .btn-primary:hover {
       background-color: #4A1F1F;
   }
    </style>
</head>
<body>

<div class="container">
    <div class="card">
        <h2 class="text-center mb-4">Мои отели</h2>

        <div th:if="${error}" class="alert alert-danger text-center">
            <span th:text="${error}"></span>
        </div>

        <table class="table table-striped">
            <thead class="table-dark">
            <tr>
                <th>Название отеля</th>
                <th>Локация</th>
                <th>Цена за ночь</th>
                <th>Управление</th>
            </tr>
            </thead>
            <tbody>
            <tr th:each="property, iterStat : ${properties}">
                <td th:text="${property.name}"></td>
                <td th:text="${property.location}"></td>
                <td th:text="'$' + ${property.pricePerNight}"></td>
                <td>
                    <a th:href="@{'/add-room/' + ${property.id}}" class="btn btn-add-room btn-sm">Добавить номер</a>
                    <a th:href="@{'/delete-property/' + ${property.id}}" class="btn btn-delete-hotel btn-sm"
                       onclick="return confirm('Вы уверены, что хотите удалить этот отель и все его номера?');">
                        Удалить отель
                    </a>
                    <button class="btn btn-show-rooms btn-sm toggle-rooms" th:data-index="${iterStat.index}">
                        Показать номера
                    </button>
                </td>
            </tr>

            <tr th:each="property, iterStat : ${properties}">
                <td colspan="4">
                    <div class="rooms-table" th:data-index="${iterStat.index}">
                        <strong>Номера отеля:</strong>
                        <table class="table table-bordered mt-2">
                            <thead>
                            <tr>
                                <th>Тип номера</th>
                                <th>Цена за ночь</th>
                                <th>Действия</th>
                            </tr>
                            </thead>
                            <tbody>
                            <tr th:each="room : ${property.rooms}" th:if="${property.rooms != null and not #lists.isEmpty(property.rooms)}">
                                <td th:text="${room.type}"></td>
                                <td th:text="${room.pricePerNight} + '$'"></td>
                                <td>
                                    <a th:href="@{'/delete-room/' + ${room.id}}" class="btn btn-delete-hotel btn-sm"
                                       onclick="return confirm('Удалить этот номер?');">Удалить</a>
                                </td>
                            </tr>
                            <tr th:if="${property.rooms == null or #lists.isEmpty(property.rooms)}">
                                <td colspan="3" class="text-muted text-center">Нет номеров</td>
                            </tr>
                            </tbody>
                        </table>
                    </div>
                </td>
            </tr>

            </tbody>
        </table>

        <div class="button-container">
            <div class="text-left">
                <a href="/" class="btn btn-secondary">Вернуться на главную</a>
            </div>
            <div class="text-right">
                <a href="/add-property" class="btn btn-primary">Добавить отель</a>
            </div>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script>
    document.addEventListener("DOMContentLoaded", function () {
        document.querySelectorAll(".toggle-rooms").forEach(button => {
            button.addEventListener("click", function () {
                const index = this.getAttribute("data-index");
                const roomsTable = document.querySelector(`.rooms-table[data-index='${index}']`);

                if (roomsTable.style.display === "none" || roomsTable.style.display === "") {
                    roomsTable.style.display = "block";
                    this.textContent = "Скрыть номера";
                } else {
                    roomsTable.style.display = "none";
                    this.textContent = "Показать номера";
                }
            });
        });
    });
</script>

</body>
</html>

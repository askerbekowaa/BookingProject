<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Личный кабинет хоста</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            background-color: #5B2C2C;
            color: white;
        }
        .container {
            max-width: 800px;
            margin-top: 50px;
        }
        .card {
            border-radius: 10px;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
            padding: 20px;
            background: #E5E5E5;
            color: black;
        }
        .card h2 {
            color: white;
        }
        .btn-primary {
            background-color: #5B2C2C;
            border: none;
        }
        .btn-primary:hover {
            background-color: #4A1F1F;
        }
        .btn-danger {
            background-color: #dc3545;
            border: none;
        }
        .btn-danger:hover {
            background-color: #b02a37;
        }
        .btn-success {
            background-color: #28a745;
            border: none;
        }
        .btn-success:hover {
            background-color: #1e7e34;
        }
        .btn-info {
            background-color: #17a2b8;
            border: none;
        }
        .btn-info:hover {
            background-color: #117a8b;
        }
        .rooms-table {
            display: none;
            margin-top: 15px;
        }
    </style>
</head>
<body>

<div class="container">
    <div class="card">
        <h2 class="text-center mb-4">Мои отели</h2>

        <div class="text-center mb-3">
            <a href="/add-property" class="btn btn-primary">Добавить отель</a>
        </div>

        <table class="table table-striped">
            <thead class="table-dark">
            <tr>
                <th>Название отеля</th>
                <th>Локация</th>
                <th>Цена за ночь</th>
                <th>Действия</th>
            </tr>
            </thead>
            <tbody>
            <tr th:each="property, iterStat : ${properties}">
                <td th:text="${property.name}"></td>
                <td th:text="${property.location}"></td>
                <td th:text="'$' + ${property.pricePerNight}"></td>
                <td>
                    <a th:href="@{'/add-room/' + ${property.id}}" class="btn btn-success btn-sm">Добавить номер</a>
                    <a th:href="@{'/delete-property/' + ${property.id}}" class="btn btn-danger btn-sm"
                       onclick="return confirm('Вы уверены, что хотите удалить этот отель и все его номера?');">
                        Удалить отель
                    </a>
                    <button class="btn btn-info btn-sm toggle-rooms" th:attr="data-index=${iterStat.index}">
                        Показать номера
                    </button>
                </td>
            </tr>

            <!-- Блок с номерами отеля -->
            <tr th:each="property, iterStat : ${properties}">
                <td colspan="4">
                    <div class="rooms-table" th:attr="data-index=${iterStat.index}">
                        <strong>Номера отеля:</strong>
                        <table class="table table-bordered mt-2">
                            <thead>
                            <tr>
                                <th>Тип номера</th>
                                <th>Цена за ночь</th>
                                <th>Действия</th>
                            </tr>
                            </thead>
                            <tbody>
                            <tr th:each="room : ${property.rooms}" th:if="${property.rooms != null and not #lists.isEmpty(property.rooms)}">
                                <td th:text="${room.type}"></td>
                                <td th:text="${room.pricePerNight} + '$'"></td>
                                <td>
                                    <a th:href="@{'/delete-room/' + ${room.id}}" class="btn btn-danger btn-sm"
                                       onclick="return confirm('Удалить этот номер?');">Удалить</a>
                                </td>
                            </tr>
                            <tr th:if="${property.rooms == null or #lists.isEmpty(property.rooms)}">
                                <td colspan="3" class="text-muted text-center">Нет номеров</td>
                            </tr>
                            </tbody>
                        </table>
                    </div>
                </td>
            </tr>

            </tbody>
        </table>

        <div class="text-center mt-4">
            <a href="/" class="btn btn-secondary">На главную</a>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script>
    document.addEventListener("DOMContentLoaded", function () {
        document.querySelectorAll(".toggle-rooms").forEach(button => {
            button.addEventListener("click", function () {
                const index = this.getAttribute("data-index");
                const roomsTable = document.querySelector(`.rooms-table[data-index='${index}']`);

                if (roomsTable.style.display === "none" || roomsTable.style.display === "") {
                    roomsTable.style.display = "block";
                    this.textContent = "Скрыть номера";
                } else {
                    roomsTable.style.display = "none";
                    this.textContent = "Показать номера";
                }
            });
        });
    });
</script>

</body>
</html>

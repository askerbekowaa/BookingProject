<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Подробности об отеле</title>
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
                   background-color: #5B2C2C;
                   color: white;
               }
               .property-container {
                   max-width: 800px;
                   margin: auto;
                   padding: 20px;
                   background: #E5E5E5;
                   border-radius: 10px;
                   box-shadow: 0 0 10px rgba(0, 0, 0, 0.2);
                   color: black;
               }
               .property-image {
                   max-width: 100%;
                   height: auto;
                   border-radius: 10px;
               }
               .card {
                   border: none;
                   box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
               }
               .btn-primary {
                   background-color: #5B2C2C;
                   border: none;
               }
               .btn-primary:hover {
                   background-color: #4A1F1F;
               }
    </style>
</head>
<body class="bg-light">

<div class="container mt-5">
    <div class="property-container">
        <h1 class="text-center">Подробности об отеле</h1>

        <div th:if="${property}">
            <h2 th:text="${property.name}" class="text-primary"></h2>

            <div class="text-center">
                <img th:src="${property.coverImagePath}" alt="Cover Image" class="property-image"
                     th:unless="${property.coverImagePath == null}" />
            </div>

            <p><strong>Местонахождение:</strong> <span th:text="${property.location}"></span></p>
            <p><strong>Цена за ночь:</strong> <span th:text="'$' + ${property.pricePerNight}"></span></p>
            <p><strong>Описание:</strong> <span th:text="${property.description}"
                                                   th:unless="${property.description == null}"></span></p>
            <p><strong>Удобства:</strong> <span th:text="${property.amenities}"
                                                 th:unless="${property.amenities == null}"></span></p>
            <p><strong>Организовано:</strong> <span th:text="${property.host.username}"></span></p>

            <!-- Добавляем таблицу с номерами -->
            <h3 class="mt-4">Номера в отели</h3>
            <div class="row">
                <div class="col-md-4" th:each="room : ${property.rooms}">
                    <div class="card">
                        <img th:src="${room.imagePath}" class="card-img-top" alt="Room Image"
                             th:unless="${room.imagePath == null}" style="height: 200px; object-fit: cover;">
                        <div class="card-body">
                            <h5 class="card-title" th:text="${room.type}"></h5>
                            <p class="card-text">
                                <strong>Удобства:</strong> <span th:text="${room.amenities}"></span><br>
                                <strong>Цена:</strong> <span th:text="'$' + ${room.pricePerNight} + '/ за ночь'"></span>
                            </p>
                            <a th:href="@{'/book-room/' + ${room.id}}" class="btn btn-primary">Забронировать сейчас</a>

                        </div>
                    </div>
                </div>
            </div>


        <div th:unless="${property}">
            <p class="text-danger">Property not found.</p>
            <a href="/" class="btn btn-secondary">Назад на главную</a>
        </div>
        </div>
    </div>
</div>
    </div>
</div>

<!-- Bootstrap JS -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
